# 运行: cd "目录"; docker compose up -d

# exvs2_local_stun (<16M)
# 对于udp,用不用'host'模式创建容器都一样,都需要wsl2的ip..
# 如果win主机用localhost或127.0.0.1访问无效, 请使用wsl2的ip, `wsl hostname -I`

version: "3"

services:
  server:
    image: vl00at111/exvs2-local-stun
    container_name: exvs2-local-stun
    
    restart: always

    ports:
      - "3478:3478/udp"  # udp
      
    environment:
      - TZ=Asia/Shanghai
    
    networks:
      - exvs2
    #network_mode: host  # 使用主机网络. 如果不指定host,默认会自己建立网络..
    
# 可选：如果使用自定义网络，取消注释并创建网络
networks:
   exvs2:
     external: true